lines:
  - कुरुक्षेत्र के युद्ध से ठीक पहले, *अर्जुन* ने अपना धनुष नीचे रख दिया।
  - सामने उसके अपने ही *गुरु* और *परिवार* वाले खड़े थे।
  - तब *श्रीकृष्ण* ने उसे जो ज्ञान दिया, वही *भगवद् गीता* है।
  - गीता के दूसरे अध्याय में वे कहते हैं,
  - "*कर्मण्येवाधिकारस्ते, मा फलेषु कदाचन।*"
  - यानी, तुम्हारा अधिकार सिर्फ़ *कर्म* पर है, उसके *फल* पर नहीं।
  - नतीजे के डर से रुको मत, अपना *पूरा मन* लगाओ।
  - इसी सीख ने अर्जुन को फिर से *खड़ा* कर दिया।
end_card:
  title: Sleep with *Impact*
  subtitle: ऐसी और कहानियों के लिए फ़ॉलो करें
